name: C/C++ CI

on:
  push:
    branches:
      - main
      - plugin
  pull_request:
    branches:
      - main

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config
      - name: Setup vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh
      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DLANGMGR_BUILD_PLUGINS=OFF \
            -DLANGMGR_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j $(nproc)
      - name: Test
        run: ctest --test-dir build

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake ninja
      - name: Setup vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh
      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DLANGMGR_BUILD_PLUGINS=OFF \
            -DLANGMGR_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j $(sysctl -n hw.logicalcpu)
      - name: Test
        run: ctest --test-dir build

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat
      - name: Configure CMake
        run: |
          cmake -B build `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -DLANGMGR_BUILD_PLUGINS=OFF `
            -DLANGMGR_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS
      - name: Test
        run: |
          $env:PATH = "${{ github.workspace }}\vcpkg_installed\x64-windows\bin;$env:PATH"
          ctest --test-dir build -C Release

  plugins:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'master'
      - name: Configure CMake
        run: |
          cmake -B build/plugins \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DLANGMGR_BUILD_PLUGINS=ON \
            -DLANGMGR_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/plugins --config Release