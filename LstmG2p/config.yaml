model_name: LSTM_G2P

data:
  dict_type: 'cmudict'
  dict_path: 'cmudict-0.7b'
  remove_word_digits: true
  remove_phoneme_digits: true

model:
  embedding_dim: 128
  hidden_dim: 256
  num_layers: 2
  dropout: 0.1
  learning_rate: 0.001
  weight_decay: 0.01
  max_phoneme_len: 48

training:
  batch_size: 64
  train_ratio: 0.9

  max_epochs: 15
  patience: 5
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  teacher_forcing_ratio: 0.5

unk_idx: 0
pad_idx: 1
bos_idx: 2
eos_idx: 3

special_symbols:
  - '<unk>'
  - '<pad>'
  - '<bos>'
  - '<eos>'

